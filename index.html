<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flower Canvas</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="clean-btn">clean the screen</div>
</div>

<div class="name">Click To Add Flower</div>

<!-- ================= FRAGMENT SHADER ================= -->
<script id="fragmentShader" type="x-shader/x-fragment">
#define PI 3.14159265359

uniform float u_ratio;
uniform vec2 u_cursor;
uniform float u_stop_time;
uniform float u_clean;
uniform vec2 u_stop_randomizer;
uniform sampler2D u_texture;

varying vec2 vUv;

/* ---------- noise ---------- */
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
float snoise(vec2 v){
    const vec4 C=vec4(0.2113248654,0.3660254038,-0.5773502692,0.0243902439);
    vec2 i=floor(v+dot(v,C.yy));
    vec2 x0=v-i+dot(i,C.xx);
    vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
    vec4 x12=x0.xyxy+C.xxzz;
    x12.xy-=i1;
    i=mod289(i);
    vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
    vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
    m=m*m; m=m*m;
    vec3 x=2.*fract(p*C.www)-1.;
    vec3 h=abs(x)-0.5;
    vec3 ox=floor(x+0.5);
    vec3 a0=x-ox;
    m*=1.792842914-0.853734721*(a0*a0+h*h);
    vec3 g;
    g.x=a0.x*x0.x+h.x*x0.y;
    g.yz=a0.yz*x12.xz+h.yz*x12.yw;
    return 130.*dot(m,g);
}

/* ---------- STEM ---------- */
float getStem(vec2 p){
    float w = 0.012;

    // only BELOW flower
    if (p.y < 0.0 || p.y > 0.35) return 0.0;

    float curve = 0.25 * snoise(vec2(p.y * 4.0, u_stop_randomizer.x * 5.0));
    p.x += curve * (0.35 - p.y);

    float stem = smoothstep(w, 0.0, abs(p.x));
    stem *= smoothstep(0.0, 0.05, p.y);
    stem *= smoothstep(0.0, 0.25, u_stop_time);

    return stem;
}

/* ---------- FLOWER ---------- */
float getFlower(vec2 p){
    float a = atan(p.y, p.x);
    float petals = 5.0 + floor(u_stop_randomizer.y * 3.0);
    float r = length(p);
    float pet = abs(sin(a * petals)) * 0.35 + 0.65;
    float size = 0.12;
    float grow = smoothstep(0.0, 0.25, u_stop_time);
    return smoothstep(size, size - 0.02, r / pet) * grow;
}

void main(){
    vec3 base = texture2D(u_texture, vUv).rgb;

    vec2 uv = vUv;
    uv.x *= u_ratio;

    vec2 cursor = vUv - u_cursor;
    cursor.x *= u_ratio;
    cursor.y *= -1.0;   // FIX inverted issue

    float stem = getStem(cursor);
    float flower = getFlower(cursor);

    vec3 stemColor = vec3(0.2, 0.8, 0.3);
    vec3 flowerColor = vec3(0.9, 0.3, 0.8);

    vec3 color = base;
    color = mix(color, stemColor, stem);
    color = mix(color, flowerColor, flower);

    color *= u_clean;

    gl_FragColor = vec4(color, 1.0);
}
</script>

<!-- ================= VERTEX SHADER ================= -->
<script id="vertexShader" type="x-shader/x-vertex">
varying vec2 vUv;
void main(){
    vUv = uv;
    gl_Position = vec4(position, 1.0);
}
</script>

<script type="module" src="main.js"></script>
</body>
</html>
